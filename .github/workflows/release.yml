name: Release

run-name: >-
  ${{ github.event_name == 'push'
      && format('Server-only {0}', github.ref_name)
      || format('Full {0}', inputs.tag) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New stable tag to release (for example, v1.2.3)'
        required: true
        type: string
      release_notes:
        description: 'Release notes for the annotated tag and GitHub Release'
        required: true
        type: string
      confirm_full:
        description: 'Create the tag and publish all release artifacts'
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      stable: ${{ steps.prepare.outputs.stable }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          INPUT_CONFIRM_FULL: ${{ inputs.confirm_full }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          validate_semver() {
            value=$1
            case "$value" in
              *+*) return 1 ;;
              v*) ;;
              *) return 1 ;;
            esac

            version=${value#v}
            core=${version%%-*}
            if [ "$core" = "$version" ]; then
              prerelease=
            else
              prerelease=${version#"$core"-}
              [ -n "$prerelease" ] || return 1
            fi

            IFS=. read -r major minor patch extra <<< "$core"
            [ -z "${extra:-}" ] || return 1
            for identifier in "$major" "$minor" "$patch"; do
              case "$identifier" in
                *[!0-9]*) return 1 ;;
                0|[1-9]|[1-9][0-9]*) ;;
                *) return 1 ;;
              esac
            done

            if [ -n "$prerelease" ]; then
              case "$prerelease" in
                .*|*.|*..*) return 1 ;;
              esac
              IFS=. read -r -a identifiers <<< "$prerelease"
              for identifier in "${identifiers[@]}"; do
                [ -n "$identifier" ] || return 1
                case "$identifier" in
                  *[!0-9A-Za-z-]*) return 1 ;;
                esac
                case "$identifier" in
                  *[!0-9]*) ;;
                  0|[1-9]|[1-9][0-9]*) ;;
                  *) return 1 ;;
                esac
              done
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            mode=server-only
            tag=$GITHUB_REF_NAME
            validate_semver "$tag" || {
              echo "Invalid release tag: $tag" >&2
              exit 1
            }
            if [ "$(git cat-file -t "$tag")" != tag ]; then
              echo "Release tags must be annotated: $tag" >&2
              exit 1
            fi
          else
            mode=full
            tag=$INPUT_TAG
            if [ "$INPUT_CONFIRM_FULL" != true ]; then
              echo 'Full release confirmation is required' >&2
              exit 1
            fi
            validate_semver "$tag" || {
              echo "Invalid stable release tag: $tag" >&2
              exit 1
            }
            case "${tag#v}" in
              *-*)
                echo 'Full releases require a stable vMAJOR.MINOR.PATCH tag' >&2
                exit 1
                ;;
            esac
            if [ -z "$INPUT_RELEASE_NOTES" ]; then
              echo 'Full release notes are required' >&2
              exit 1
            fi

            remote_refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if [ -z "$remote_refs" ]; then
              remote_head=$(git ls-remote --heads origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
              if [ -z "$remote_head" ] || [ "$remote_head" != "$(git rev-parse HEAD)" ]; then
                echo "Full releases must start from the current remote default branch HEAD" >&2
                exit 1
              fi

              release_status=$(curl --silent --show-error \
                --output "$RUNNER_TEMP/release.json" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
              case "$release_status" in
                404) ;;
                200)
                  echo "GitHub Release already exists: $tag" >&2
                  exit 1
                  ;;
                *)
                  echo "Unable to verify GitHub Release state (HTTP $release_status)" >&2
                  exit 1
                  ;;
              esac

              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a "$tag" -m "$tag" -m "$INPUT_RELEASE_NOTES"
              git push origin "refs/tags/$tag"
            else
              if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
                echo "Tag already exists: $tag" >&2
                exit 1
              fi
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "Retry tag no longer points to the workflow commit: $tag" >&2
                exit 1
              fi
            fi
          fi

          version=${tag#v}
          case "$version" in
            *-*) stable=false ;;
            *) stable=true ;;
          esac

          tag_message=$(git for-each-ref --format='%(contents:body)' "refs/tags/$tag")
          delimiter="TAG_MESSAGE_$(openssl rand -hex 16)"
          while printf '%s\n' "$tag_message" | grep -Fqx "$delimiter"; do
            delimiter="TAG_MESSAGE_$(openssl rand -hex 16)"
          done

          {
            echo "mode=$mode"
            echo "stable=$stable"
            echo "tag=$tag"
            echo "version=$version"
            echo "tag_message<<$delimiter"
            printf '%s\n' "$tag_message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.27.0'

      - name: Set up QEMU
        if: ${{ steps.prepare.outputs.mode == 'full' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check full release integrations
        id: integrations
        if: ${{ steps.prepare.outputs.mode == 'full' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'has_dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_dockerhub=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Login to DockerHub
        if: ${{ steps.prepare.outputs.mode == 'full' && steps.integrations.outputs.has_dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner for GHCR
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Run server-only GoReleaser
        if: ${{ steps.prepare.outputs.mode == 'server-only' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --config=.goreleaser.simple.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.prepare.outputs.tag_message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          IS_STABLE: ${{ steps.prepare.outputs.stable }}

      - name: Run full GoReleaser
        if: ${{ steps.prepare.outputs.mode == 'full' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --config=.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.prepare.outputs.tag_message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ steps.integrations.outputs.has_dockerhub == 'true' && secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Update DockerHub description
        if: ${{ steps.prepare.outputs.mode == 'full' && steps.integrations.outputs.has_dockerhub == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: 'Sub2API - AI API Gateway Platform'
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: ${{ steps.prepare.outputs.mode == 'full' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ steps.integrations.outputs.has_dockerhub == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.prepare.outputs.tag }}
          TAG_MESSAGE: ${{ steps.prepare.outputs.tag_message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'Telegram credentials not configured, skipping notification'
            exit 0
          fi

          version=${TAG_NAME#v}
          ghcr_image="ghcr.io/${REPOSITORY,,}"
          escaped_message=$(printf '%s' "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')
          if [ ${#escaped_message} -gt 3500 ]; then
            escaped_message="${escaped_message:0:3500}..."
          fi

          message="Sub2API release ${version}"$'\n\n'
          if [ -n "$escaped_message" ]; then
            message+="${escaped_message}"$'\n\n'
          fi
          message+="Docker:"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            message+="docker pull ${DOCKERHUB_USERNAME}/sub2api:${version}"$'\n'
          fi
          message+="docker pull ${ghcr_image}:${version}"$'\n\n'
          message+="https://github.com/${REPOSITORY}/releases/tag/${TAG_NAME}"

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n \
              --arg chat_id "$TELEGRAM_CHAT_ID" \
              --arg text "$message" \
              '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

  sync-version-file:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-version-sync
      cancel-in-progress: false
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Sync stable VERSION file
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current_version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          if [ "$current_version" = "$RELEASE_VERSION" ]; then
            echo "VERSION already matches $RELEASE_VERSION"
            exit 0
          fi

          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$current_version" =~ $stable_semver ]]; then
            echo "Current VERSION is not stable SemVer: $current_version" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ $stable_semver ]]; then
            echo "Release VERSION is not stable SemVer: $RELEASE_VERSION" >&2
            exit 1
          fi

          version_is_greater() {
            IFS=. read -r -a candidate <<< "$1"
            IFS=. read -r -a existing <<< "$2"
            for index in 0 1 2; do
              candidate_part=${candidate[$index]}
              existing_part=${existing[$index]}
              if [ ${#candidate_part} -gt ${#existing_part} ]; then
                return 0
              fi
              if [ ${#candidate_part} -lt ${#existing_part} ]; then
                return 1
              fi
              if [[ "$candidate_part" > "$existing_part" ]]; then
                return 0
              fi
              if [[ "$candidate_part" < "$existing_part" ]]; then
                return 1
              fi
            done
            return 1
          }

          if ! version_is_greater "$RELEASE_VERSION" "$current_version"; then
            echo "VERSION $current_version is newer than or equal to $RELEASE_VERSION; skipping"
            exit 0
          fi

          printf '%s\n' "$RELEASE_VERSION" > backend/cmd/server/VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${RELEASE_VERSION} [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
